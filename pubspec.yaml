name: scentmatch
description: Personal fragrance discovery, collection and recommendations.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.32.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_riverpod: 2.6.1
  go_router: 14.6.2
  firebase_core: 3.8.1
  firebase_auth: 5.3.4
  cloud_firestore: 5.5.1
  firebase_storage: 12.3.7
  firebase_analytics: 11.3.6
  cloud_functions: 5.2.0
  firebase_app_check: 0.3.1+7
  google_sign_in: 6.2.2
  shared_preferences: 2.3.3
  url_launcher: 6.3.1
  purchases_flutter: 8.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/perfumes.json
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
